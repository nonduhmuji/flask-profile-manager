<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | Profile Management System</title>

    <!-- Connect the external CSS stylesheet -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>User Profile Management System</h1>
        <p>Create your account below</p>
      </div>

      <h2>Register New User</h2>

      <!-- Send registration information to Flask -->
      <form action="{{ url_for('register') }}" method="POST">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            minlength="2"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g. 0821234567"
            pattern="[0-9]{10}"
            maxlength="10"
            title="Enter a 10-digit phone number"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 8 characters"
            minlength="8"
            required
          />
        </div>

        <button type="submit" class="btn">Register Account</button>
      </form>

      <div class="footer">
        <p>Profile Management System</p>
        <p>Powered by Python Flask & SQLite</p>
      </div>
    </div>
  </body>
</html>
