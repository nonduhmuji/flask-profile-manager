<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Update Profile | Profile Management System</title>

    <!-- Load the external CSS file -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>User Profile Management System</h1>
        <p>Keep your personal details up to date</p>
      </div>

      <h2>Update Your Profile</h2>

      <p class="subtitle">Edit your information and save your changes.</p>

      <!-- Submit changes to the update_profile route -->
      <form
        action="{{ url_for('update_profile', user_id=user.id) }}"
        method="POST"
      >
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            value="{{ user.name }}"
            minlength="2"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            value="{{ user.email }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ user.phone }}"
            pattern="[0-9]{10}"
            maxlength="10"
            required
          />
        </div>

        <button type="submit" class="btn">Save Changes</button>
      </form>

      <!-- Return to the user's profile -->
      <a
        class="btn btn-secondary"
        href="{{ url_for('view_profile', user_id=user.id) }}"
      >
        Back to Profile
      </a>

      <div class="footer">
        <p>Profile Management System</p>
        <p>Powered by Python Flask & SQLite</p>
      </div>
    </div>
  </body>
</html>
